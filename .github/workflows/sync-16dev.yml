name: Sync 16-dev

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Sync upstream 16-dev
        env:
          SSH_PUSH_KEY: ${{ secrets.SSH_PUSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PUSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git remote add upstream https://github.com/LawnchairLauncher/lawnchair.git
          git fetch upstream 16-dev
          git push git@github.com:JediRhymeTrix/Lawnchair.git FETCH_HEAD:refs/heads/16-dev --force
