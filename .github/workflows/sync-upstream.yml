name: Sync upstream 16-dev

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream-16-dev
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure deploy key
        env:
          DEPLOY_KEY: ${{ secrets.UPSTREAM_SYNC_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Rebase fork changes onto upstream
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/LawnchairLauncher/lawnchair.git
          git fetch upstream 16-dev
          git checkout 16-dev
          if git merge-base --is-ancestor upstream/16-dev HEAD; then
            echo 'Already current with upstream.'
            exit 0
          fi
          git rebase upstream/16-dev
          git remote set-url --push origin git@github.com:JediRhymeTrix/Lawnchair.git
          git push origin 16-dev --force-with-lease